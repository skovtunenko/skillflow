name: release

# A commit on main titled "Release v<YYYY.MM.DD.N>" (the squash commit of a release pull request)
# gets the tag and the GitHub Release of that version. Other commits do nothing.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(printf '%s\n' "$MESSAGE" | head -n1 | sed -nE 's/^Release (v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+)( \(#[0-9]+\))?$/\1/p')
          if [ -z "$version" ]; then echo "Not a release commit."; exit 0; fi
          if gh release view "$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "$version already exists."; exit 0; fi
          gh release create "$version" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$version" --generate-notes
